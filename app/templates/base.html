<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechBol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('inicio') }}">TechBol</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('bp_clientes.index') }}">Clientes</a>
                <a class="nav-link" href="{{ url_for('bp_productos.index') }}">Productos</a>
                <a class="nav-link" href="{{ url_for('bp_pedidos.index') }}">Pedidos</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
