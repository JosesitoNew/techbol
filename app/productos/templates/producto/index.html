{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h1>Productos</h1>
    <a class="btn btn-success align-self-center" href="{{ url_for('bp_productos.create') }}">Nuevo</a>
</div>
<table class="table table-dark table-striped table-hover">
    <thead>
        <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    {% for p in productos %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ '%.2f'|format(p.precio) }}</td>
            <td>{{ p.stock }}</td>
            <td class="d-flex gap-2">
                <a class="btn btn-warning btn-sm" href="{{ url_for('bp_productos.edit', id=p.id) }}">Editar</a>
                <form method="POST" action="{{ url_for('bp_productos.delete', id=p.id) }}"
                      onsubmit="return confirm('¿Está seguro de eliminar?');">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="5">No hay registros</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
