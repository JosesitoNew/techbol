{% extends "base.html" %}
{% block content %}
<h1>{% if producto %}Editar{% else %}Nuevo{% endif %} producto</h1>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" name="nombre" required
               value="{{ producto.nombre if producto else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number" step="0.01" min="0" class="form-control" name="precio" required
               value="{{ producto.precio if producto else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Stock</label>
        <input type="number" min="0" class="form-control" name="stock"
               value="{{ producto.stock if producto else 0 }}">
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="{{ url_for('bp_productos.index') }}">Cancelar</a>
</form>
{% endblock %}
