{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h1>Clientes</h1>
    <a class="btn btn-success align-self-center" href="{{ url_for('bp_clientes.create') }}">Nuevo</a>
</div>
<table class="table table-dark table-striped table-hover">
    <thead>
        <tr><th>ID</th><th>Nombre</th><th>Teléfono</th><th>Acciones</th></tr>
    </thead>
    <tbody>
    {% for c in clientes %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nombre }}</td>
            <td>{{ c.telefono }}</td>
            <td class="d-flex gap-2">
                <a class="btn btn-warning btn-sm" href="{{ url_for('bp_clientes.edit', id=c.id) }}">Editar</a>
                <form method="POST" action="{{ url_for('bp_clientes.delete', id=c.id) }}"
                      onsubmit="return confirm('¿Está seguro de eliminar?');">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="4">No hay registros</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
